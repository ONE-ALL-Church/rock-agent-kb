[project]
name = "rock-general-knowledge-base"
version = "0.1.0"
description = "Agent-first Rock RMS knowledge base tooling and source registry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "markdownify>=0.11.6",
    "pydantic>=2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
media = [
    "mlx-whisper>=0.4.3",
    "openai>=1.90.0",
    "yt-dlp>=2025.1.0",
]
serve = [
    "mcp>=1.0",
]

[project.scripts]
kb = "rock_kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rock_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
