name: Public Surface

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-surface:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: service/package-lock.json
      - name: Audit tracked public surface
        run: python3 scripts/audit_tracked_tree.py
      - name: Validate contribution bundles
        run: python3 scripts/validate_bundle.py
      - name: Install uv
        run: python -m pip install uv
      - name: Audit duplicate source URLs
        run: uv run kb audit source-url-duplicates
      - name: Install service dependencies
        working-directory: service
        run: npm ci
      - name: Check service types
        working-directory: service
        run: npm run check
      - name: Test service intake gates
        working-directory: service
        run: npm run test:intake
      - name: Run canonical retrieval compatibility shadow
        run: uv run kb tools canonical-retrieval-shadow --skip-worker-build
      - name: Run lexical retrieval quality gate
        run: uv run kb quality-gate --concurrency 3
