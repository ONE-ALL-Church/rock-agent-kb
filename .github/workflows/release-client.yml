name: Release Client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the package and changelog, for example rock-kb-v0.5.0.
        required: true
  push:
    tags:
      - "rock-kb-v*"

jobs:
  release-client:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Validate release version
        working-directory: .
        run: uv run python scripts/validate_release_version.py --tag "${RELEASE_TAG}"
      - name: Install service dependencies
        working-directory: service
        run: npm ci
      - name: Run public audits
        working-directory: .
        run: |
          python3 scripts/audit_tracked_tree.py
          python3 scripts/validate_bundle.py
          uv run kb audit public-export
      - name: Run lexical retrieval quality gate
        working-directory: .
        run: uv run kb quality-gate --concurrency 3
      - name: Build and validate OKF distribution
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#rock-kb-v}"
          commit="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir -p previous-okf release-assets
          gh release download --repo "${GITHUB_REPOSITORY}" --pattern 'rock-agent-kb-okf-v*.zip' --dir previous-okf || true
          gh release download --repo "${GITHUB_REPOSITORY}" --pattern 'rock-agent-kb-okf-core-v*.zip' --dir previous-okf || true
          full_previous=()
          core_previous=()
          full_path="$(find previous-okf -maxdepth 1 -name 'rock-agent-kb-okf-v*.zip' -print -quit)"
          core_path="$(find previous-okf -maxdepth 1 -name 'rock-agent-kb-okf-core-v*.zip' -print -quit)"
          test -z "${full_path}" || full_previous=(--previous-bundle "${full_path}")
          test -z "${core_path}" || core_previous=(--previous-bundle "${core_path}")
          test -z "${full_path}" || uv run --project clients/python rock-kb okf conformance "${full_path}"
          test -z "${core_path}" || uv run --project clients/python rock-kb okf conformance "${core_path}"
          uv run python scripts/check_okf_upstream.py
          uv run kb publish okf --profile full --version "${version}" --source-commit "${commit}" --archive-dir release-assets "${full_previous[@]}"
          uv run kb publish okf --profile core --destination data/okf-export-core --version "${version}" --source-commit "${commit}" --archive-dir release-assets "${core_previous[@]}"
          uv run kb publish okf-validate data/okf-export
          uv run kb publish okf-validate data/okf-export-core
          uv run --project clients/python rock-kb okf conformance "release-assets/rock-agent-kb-okf-v${version}.zip"
          uv run --project clients/python rock-kb okf verify "release-assets/rock-agent-kb-okf-v${version}.zip"
          uv run --project clients/python rock-kb okf conformance "release-assets/rock-agent-kb-okf-core-v${version}.zip"
          uv run --project clients/python rock-kb okf verify "release-assets/rock-agent-kb-okf-core-v${version}.zip"
          uv run python scripts/validate_okf_reference_interop.py data/okf-export
          uv run python scripts/validate_okf_reference_interop.py data/okf-export-core
      - name: Attest OKF release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.tar.gz
      - name: Build package
        run: uv build
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl rock-kb --help
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz rock-kb --help
      - name: Publish package with token
        if: ${{ env.PYPI_TOKEN != '' }}
        env:
          UV_PUBLISH_TOKEN: ${{ env.PYPI_TOKEN }}
        run: uv publish
      - name: Publish package with trusted publishing
        if: ${{ env.PYPI_TOKEN == '' }}
        run: uv publish
      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/rock-kb-v') }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          --title "${GITHUB_REF_NAME}" release-assets/*
