name: Validate Contributions

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        run: python -m pip install pyyaml
      - name: Validate org registry
        run: python scripts/validate_orgs.py
      - name: Validate contribution bundles
        run: python scripts/validate_bundle.py
