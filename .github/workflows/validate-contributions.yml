name: Validate Contributions

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate contribution bundles
        run: python scripts/validate_bundle.py

# protection proof: workflow changes require review
