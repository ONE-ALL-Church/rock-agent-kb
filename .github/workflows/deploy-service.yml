name: Deploy Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "canonical/**"
      - "claims/**"
      - "knowledge/**"
      - "sources/**"
      - "concepts/**"
      - "community-contributions/**"
      - "source-suggestions/**"
      - "ideas/**"
      - "orgs/**"
      - "skills/rock-kb-agent/**"
      - "service/src/**"
      - "service/package.json"
      - "service/package-lock.json"
      - "service/tsconfig.json"
      - "service/wrangler.jsonc"
      - "scripts/validate_bundle.py"
      - "scripts/validate_orgs.py"
      - "src/rock_kb/contribution_sources.py"
      - "src/rock_kb/canonical_knowledge.py"
      - "src/rock_kb/canonical_retrieval_shadow.py"
      - "src/rock_kb/schemas/knowledge.py"
      - "src/rock_kb/schemas/source_native.py"
      - "src/rock_kb/source_native.py"
      - "src/rock_kb/service_projection.py"
      - "src/rock_kb/service_eval.py"
      - "src/rock_kb/hosted_evaluation.py"
      - "src/rock_kb/rock_ideas.py"
      - "src/rock_kb/rock_idea_relationships.py"
      - "src/rock_kb/okf_export.py"
      - "src/rock_kb/cli/workflow_cmds.py"

concurrency:
  group: rock-kb-production-deploy
  cancel-in-progress: false

jobs:
  deploy-service:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROCK_KB_BASE_URL: ${{ vars.ROCK_KB_BASE_URL }}
      ROCK_KB_D1_DATABASE: ${{ vars.ROCK_KB_D1_DATABASE }}
      ROCK_KB_D1_DATABASE_ID: ${{ vars.ROCK_KB_D1_DATABASE_ID }}
      ROCK_KB_R2_BUCKET: ${{ vars.ROCK_KB_R2_BUCKET }}
      ROCK_KB_WORKER_GITHUB_TOKEN: ${{ secrets.ROCK_KB_WORKER_GITHUB_TOKEN }}
      ORG_TOKEN_SHA256_JSON: ${{ secrets.ORG_TOKEN_SHA256_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: service/package-lock.json
      - name: Install service dependencies
        working-directory: service
        run: npm ci
      - name: Configure production Cloudflare bindings
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.ROCK_KB_D1_DATABASE_ID != '' }}
        run: >
          python3 scripts/configure_service_bindings.py --env production
          --d1-database "${ROCK_KB_D1_DATABASE:-rock-agent-kb}"
          --d1-database-id "${ROCK_KB_D1_DATABASE_ID}"
          --r2-bucket "${ROCK_KB_R2_BUCKET:-rock-agent-kb-artifacts}"
      - name: Generate Worker types
        working-directory: service
        run: npm run types
      - name: Check Wrangler config
        working-directory: service
        run: npm run wrangler:check
      - name: Type-check Worker
        working-directory: service
        run: npm run check
      - name: Validate contribution intake
        run: |
          uv run python scripts/validate_orgs.py
          uv run python scripts/validate_bundle.py
      - name: Audit public knowledge surface
        run: uv run kb audit all --public-only
      - name: Build service projection
        run: uv run kb deploy-service
      - name: Run lexical retrieval quality gate
        run: uv run kb quality-gate
      - name: Enforce shadow service lifecycle
        run: uv run kb shadow-lifecycle --strict
      - name: Sync Worker runtime secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.ROCK_KB_D1_DATABASE_ID != '' }}
        working-directory: service
        run: |
          if [ -n "${ROCK_KB_WORKER_GITHUB_TOKEN}" ]; then
            printf '%s' "${ROCK_KB_WORKER_GITHUB_TOKEN}" | npx wrangler secret put GITHUB_TOKEN --env production
          else
            echo "::notice::ROCK_KB_WORKER_GITHUB_TOKEN is not configured; hosted kb_submit can validate but cannot open PRs."
          fi
          if [ -n "${ORG_TOKEN_SHA256_JSON}" ]; then
            printf '%s' "${ORG_TOKEN_SHA256_JSON}" | npx wrangler secret put ORG_TOKEN_SHA256_JSON --env production
          else
            echo "::notice::ORG_TOKEN_SHA256_JSON is not configured; hosted kb_submit will reject org tokens."
          fi
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.ROCK_KB_D1_DATABASE_ID != '' }}
        run: >
          uv run kb deploy-service --apply --env production
          --database "${ROCK_KB_D1_DATABASE:-rock-agent-kb}"
          --bucket "${ROCK_KB_R2_BUCKET:-rock-agent-kb-artifacts}"
      - name: Report skipped Cloudflare deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.ROCK_KB_D1_DATABASE_ID == '' }}
        run: >
          echo "::notice::Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN,
          CLOUDFLARE_ACCOUNT_ID, or ROCK_KB_D1_DATABASE_ID is not configured."
      - name: Smoke-test hosted service
        if: ${{ env.ROCK_KB_BASE_URL != '' }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${ROCK_KB_BASE_URL}/health" >/tmp/health.json
          uv run python -c 'import json; payload=json.load(open("/tmp/health.json")); shadow=payload.get("canonical_shadow") or {}; assert shadow.get("status") == "ready"; assert shadow.get("active_reader") is False; assert shadow.get("active_retrieval_projection") == "legacy"'
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${ROCK_KB_BASE_URL}/skill/manifest.json" >/tmp/skill-manifest.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${ROCK_KB_BASE_URL}/manifest.json" >/tmp/manifest.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${ROCK_KB_BASE_URL}/operations/dashboard" >/tmp/operations-dashboard.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${ROCK_KB_BASE_URL}/operations/freshness" >/tmp/source-freshness.json
          uv run kb eval-service --base-url "${ROCK_KB_BASE_URL}" --limit 5 --output /tmp/hosted-evaluation.json
      - name: Record hosted evaluation summary
        if: ${{ env.ROCK_KB_BASE_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.ROCK_KB_D1_DATABASE_ID != '' }}
        run: >
          uv run kb record-hosted-eval /tmp/hosted-evaluation.json
          --database "${ROCK_KB_D1_DATABASE:-rock-agent-kb}"
          --env production
      - name: Enforce bounded artifact retention
        if: ${{ env.ROCK_KB_BASE_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: >
          uv run kb service-retention --apply --base-url "${ROCK_KB_BASE_URL}"
          --bucket "${ROCK_KB_R2_BUCKET:-rock-agent-kb-artifacts}"
